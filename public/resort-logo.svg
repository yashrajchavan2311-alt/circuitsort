<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReSort logo">
  <!-- ReSort logo: a circular recycle arrow forming the "re" motif, with a sorting bin (trapezoid) below -->

  <!-- Sorting bin (trapezoid) at bottom -->
  <path d="M 18 42 L 46 42 L 42 58 L 22 58 Z" stroke="url(#resortGrad)" stroke-width="2.8" stroke-linejoin="round" fill="url(#resortGradFill)" />
  <!-- Bin divider lines (3 compartments) -->
  <line x1="27" y1="44" x2="25" y2="56" stroke="url(#resortGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="37" y1="44" x2="39" y2="56" stroke="url(#resortGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Circular recycle arrow above the bin — the "re" motif -->
  <path d="M 32 8 A 16 16 0 0 1 48 24" stroke="url(#resortGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <!-- Arrowhead at end of arc (pointing down into bin) -->
  <path d="M 48 24 L 44 28 M 48 24 L 52 28" stroke="url(#resortGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <!-- Arrowhead at start of arc (top) -->
  <path d="M 32 8 L 28 4 M 32 8 L 36 4" stroke="url(#resortGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Small dot in center of arc — AI/vision node -->
  <circle cx="32" cy="24" r="3" fill="url(#resortGrad)" />

  <defs>
    <linearGradient id="resortGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="resortGradFill" x1="18" y1="42" x2="46" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="1" stop-color="#0d9488" stop-opacity="0.25" />
    </linearGradient>
  </defs>
</svg>
